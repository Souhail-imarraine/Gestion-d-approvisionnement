# Base de donnees - LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/tricol_stock_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Serveur
server.port=8081
server.servlet.context-path=/tricol-stock

# Logging
logging.level.com.tricol=DEBUG
logging.level.org.springframework.security=DEBUG

# ========================================
# KEYCLOAK OAUTH2 CONFIGURATION
# ========================================

# OAuth2 Resource Server - JWT Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tricol-stock
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/tricol-stock/protocol/openid-connect/certs

# Keycloak Admin Client Configuration (for user management)
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=tricol-stock
keycloak.resource=tricol-stock-app
keycloak.credentials.secret=CHANGE_THIS_TO_YOUR_CLIENT_SECRET
keycloak.use-resource-role-mappings=true
keycloak.bearer-only=true

